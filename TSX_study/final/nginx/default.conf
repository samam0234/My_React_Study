# study17: 정적 파일 + SPA fallback + API 프록시.
# 백엔드 주소는 변수로 지정하고 resolver 로 요청 시점에 해석한다 → 백엔드가 아직 없어도 Nginx 는 시작되고 502 만 낸다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker 내장 DNS
    set $api_upstream http://api:8080;        # compose 서비스 이름 (Spring Boot)

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 헬스체크
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA: 없는 경로는 index.html 로 (새로고침 404 방지). index.html 은 캐시하지 않는다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 빌드된 JS/CSS 는 파일명에 해시가 있어 오래 캐시해도 안전하다.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API → Spring Boot. 변수 proxy_pass 는 원래 URI(/api/...)를 그대로 전달한다.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # AI 스트리밍(SSE): 버퍼링을 꺼야 글자가 생성되는 대로 브라우저에 도착한다 (노션: SSE 는 proxy_buffering off).
    location /api/ai/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
    }

    client_max_body_size 1m;   # 백엔드 본문 한도(1MB)와 맞춤
}
