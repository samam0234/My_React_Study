# study17: ci 가 성공하면 이미지를 ghcr.io 에 올린다. (아직 실행해 보지 않음 — 배포 대상 서버/호스팅은 직접 정해야 한다)
# 비밀은 저장소 Settings → Secrets 에만 둔다. GITHUB_TOKEN 은 자동 제공된다.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    branches: [master]
    types: [completed]

jobs:
  images:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: web, context: ./TSX_study/final }
          - { name: api, context: ./backend-spring }
          - { name: mcp, context: ./board-mcp }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT" # ghcr 이름은 소문자만
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}

  # 서버(VPS)에서는 `docker compose pull && docker compose up -d` 로 새 이미지를 반영한다 (노션 "배포 · Nginx · CI/CD 기초").
  # 정적 프론트만 Vercel/Netlify 에 올릴 때는 이 job 없이 호스팅의 Git 연동으로 충분하다 (Root Directory = TSX_study/final).
