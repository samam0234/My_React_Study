# study15: 올릴 때마다 같은 검사를 자동으로 돌린다. (이 파일은 아직 GitHub 에서 실행해 보지 않았다 — 로컬에서 같은 명령을 각각 실행해 확인함)
# 이 저장소는 한 저장소 안에 프로젝트가 여러 개라 job 마다 working-directory 를 지정한다.
# 노션 "배포 · Nginx · CI/CD 기초"의 ci.yml 구조(테스트 → 빌드 → 이미지)를 이 저장소 구성에 맞춘 것이다.
name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    # Spring Boot 통합 테스트는 Testcontainers 로 PostgreSQL 16 컨테이너를 띄운다 (ubuntu-latest 에는 Docker 가 있다)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
      - run: ./gradlew bootJar --no-daemon -x test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TSX_study/final
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TSX_study/final/package-lock.json
      - run: npm ci
      - run: npm run check # 타입 검사 + 린트 + 포맷
      - run: npm run test:run # 단위·통합 (Vitest + RTL + MSW)
      - run: npm run build

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: board-mcp/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    # 실제 PostgreSQL + Spring Boot + Vite 를 playwright 가 직접 띄운다 (scripts/start-backend.mjs)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TSX_study/final
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TSX_study/final/package-lock.json
      - run: chmod +x ../../backend-spring/gradlew
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run e2e:cors
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: TSX_study/final/test-results

  docker:
    needs: [backend, frontend, mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build # api, web 이미지가 모두 빌드되는지 확인
