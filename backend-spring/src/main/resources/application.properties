spring.application.name=board-api
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# ---- DB: PostgreSQL 이 기본 (노션: "PostgreSQL 프로파일을 기본 DB로") ----
# 로컬: docker compose up -d db  (루트 docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/board}
spring.datasource.username=${DB_USER:board}
spring.datasource.password=${DB_PASSWORD:board}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---- JSON ----
spring.jackson.default-property-inclusion=non_null

# ---- 앱 설정 (비밀은 환경 변수로만) ----
# JWT_SECRET 이 비어 있으면 개발용 임시 키를 만든다(재시작하면 토큰 무효). prod 프로파일에서는 반드시 필요.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
app.jwt.require-secret=false
app.cors.origins=${CORS_ORIGIN:http://localhost:5173}
app.seed.enabled=${APP_SEED:false}
app.limits.max-body-bytes=1048576
app.limits.login-attempts-per-minute=10

# ---- AI (노션 "AI 모델 연동 · MCP") ----
# AI_PROVIDER=anthropic | mock. 비우면 ANTHROPIC_API_KEY 가 있을 때 anthropic, 없으면 mock.
app.ai.provider=${AI_PROVIDER:}
app.ai.model=${AI_MODEL:claude-opus-5-5}
app.ai.max-tokens=4000
app.ai.daily-token-limit=${AI_DAILY_TOKEN_LIMIT:200000}
app.ai.requests-per-minute=${AI_REQUESTS_PER_MINUTE:10}

# ---- OpenAPI 문서: 스펙 v1 §7 ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
