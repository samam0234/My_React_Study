# 테스트 전용 설정. DB 접속 정보는 Testcontainers(PostgreSQL 16)가 주입한다.
app.jwt.secret=test-secret-test-secret-test-secret-0123456789
app.jwt.ttl-seconds=3600
app.cors.origins=http://localhost:5173
app.seed.enabled=false
app.ai.provider=mock
app.ai.requests-per-minute=1000
app.limits.login-attempts-per-minute=5
logging.level.org.hibernate.SQL=warn
